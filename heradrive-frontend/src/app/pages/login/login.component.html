<div class="flex items-center justify-center min-h-screen bg-primary-100">
   
  <div class="w-full max-w-2xl  bg-white rounded-2xl shadow-lg flex">
  <div class="w-full max-w-sm p-8 bg-white rounded-3xl shadow-xl relative">
  <img src="../../../assets/logo.png" alt="" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 ">
</div>

    <div class=" w-full max-w-sm p-8 ">
      <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">S'authentifier</h2>
    <form>
      <!-- Email -->
      <div class="mb-4">
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
          Email
        </label>
        <input
          type="email"
          id="email"
          placeholder="Entrez votre email"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
        />
      </div>

      <!-- Mot de passe -->
      <div class="mb-6">
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
          Mot de passe
        </label>
        <input
          type="password"
          id="password"
          placeholder="••••••••"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
        />
      </div>

      <!-- Bouton de connexion -->
      <button
        type="submit"
        class="w-full bg-blue-600 text-white py-2 px-4 rounded-lg font-medium hover:bg-blue-700 transition duration-300"
      >
        Se connecter
      </button>
    </form>

    <!-- Lien mot de passe oublié -->
    <p class="mt-4 text-sm text-center text-gray-600">
      Mot de passe oublié ?
      <a href="#" class="text-blue-600 hover:underline">Réinitialiser</a>
    </p>
  </div>
    </div>
</div>
